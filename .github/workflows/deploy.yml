name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-deploy-${ github.ref }
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: [self-hosted, linux, proxmox]
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
        env:
          COMPOSER_AUTH: ${ secrets.COMPOSER_AUTH }

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force 2>/dev/null || true

      - name: Run tests
        run: php artisan test --parallel 2>/dev/null || php artisan test

      - name: Composer audit
        run: composer audit --no-interaction

  deploy-staging:
    name: Deploy → Staging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, proxmox]
    environment:
      name: staging
      url: ${ vars.STAGING_URL }

    steps:
      - name: Add SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${ secrets.SSH_PRIVATE_KEY }
          ssh-auth-sock: ${ runner.temp }/ssh_agent_staging.sock

      - name: Deploy to staging via SSH
        env:
          STAGING_HOST: 158.220.94.35
          STAGING_PATH: /home/ploi/localelogic.makeapp.uk
        run: |
          set -euo pipefail
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ploi@$STAGING_HOST "cd $STAGING_PATH && bash .ploi/deploy.sh"

      - name: Wait for staging to become ready
        env:
          SMOKE_URL: ${ vars.STAGING_URL }
          TIMEOUT: 300
        run: |
          set -euo pipefail
          echo "Polling $SMOKE_URL for up to ${ TIMEOUT }s..."
          for i in $(seq 1 "$TIMEOUT"); do
            if curl -fsS --max-time 10 "$SMOKE_URL" >/dev/null 2>&1; then
              echo "Staging ready after ${ i }s"
              exit 0
            fi
            sleep 1
          done
          echo "Staging did not become ready within ${ TIMEOUT }s" >&2
          exit 1

      - name: Staging smoke test
        env:
          SMOKE_URL: ${ vars.STAGING_URL }
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SMOKE_URL")
          if [[ "$STATUS" != "200" ]]; then
            echo "Smoke test failed: $SMOKE_URL returned HTTP $STATUS" >&2
            exit 1
          fi
          echo "Smoke test passed: HTTP $STATUS"

  deploy-production:
    name: Deploy → Production
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, proxmox]
    environment:
      name: production
      url: ${ vars.PRODUCTION_URL }

    steps:
      - name: Add SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${ secrets.SSH_PRIVATE_KEY }
          ssh-auth-sock: ${ runner.temp }/ssh_agent_production.sock

      - name: Deploy to production via SSH
        env:
          PRODUCTION_HOST: 94.72.111.67
          PRODUCTION_PATH: /home/ploi/localelogic.uk
        run: |
          set -euo pipefail
          ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 ploi@$PRODUCTION_HOST "cd $PRODUCTION_PATH && bash .ploi/deploy.sh"

      - name: Wait for production to become ready
        env:
          SMOKE_URL: ${ vars.PRODUCTION_URL }
          TIMEOUT: 300
        run: |
          set -euo pipefail
          echo "Polling $SMOKE_URL for up to ${ TIMEOUT }s..."
          for i in $(seq 1 "$TIMEOUT"); do
            if curl -fsS --max-time 10 "$SMOKE_URL" >/dev/null 2>&1; then
              echo "Production ready after ${ i }s"
              exit 0
            fi
            sleep 1
          done
          echo "Production did not become ready within ${ TIMEOUT }s" >&2
          exit 1

      - name: Production smoke test
        env:
          SMOKE_URL: ${ vars.PRODUCTION_URL }
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$SMOKE_URL")
          if [[ "$STATUS" != "200" ]]; then
            echo "Smoke test failed: $SMOKE_URL returned HTTP $STATUS" >&2
            exit 1
          fi
          echo "Smoke test passed: HTTP $STATUS"
